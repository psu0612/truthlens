<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruthLens v2 — Deepfake Provenance Registry on Rialo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#030306;--card:#0B0B12;--card2:#0F0F18;--border:#151520;--t:#00D4AA;--b:#0088CC;--r:#E63946;--o:#F4A261;--p:#845EC2;--w:#EEECEA;--g:#888;--gl:#AAA;--gd:#555}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#D8D5D0;font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
::selection{background:rgba(0,212,170,0.2)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(0,212,170,0.3)}50%{box-shadow:0 0 60px rgba(0,212,170,0.5)}}
@keyframes slideRight{from{width:0}to{width:100%}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes scan{0%{top:0;opacity:1}100%{top:100%;opacity:0}}
@keyframes ripple{0%{transform:scale(0.8);opacity:0.5}100%{transform:scale(2.5);opacity:0}}
@keyframes typewriter{from{width:0}to{width:100%}}
@keyframes blink{50%{border-color:transparent}}
@keyframes orbitSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes scanLine{0%{top:0%;opacity:0.8}50%{opacity:1}100%{top:95%;opacity:0.3}}
@keyframes scanGlow{0%,100%{box-shadow:0 0 20px rgba(0,212,170,0.2)}50%{box-shadow:0 0 40px rgba(0,212,170,0.4)}}
@keyframes countUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes heroGradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes borderGlow{0%,100%{border-color:rgba(0,212,170,0.1)}50%{border-color:rgba(0,212,170,0.3)}}
@keyframes verdictPop{0%{opacity:0;transform:scale(0.7)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes verdictGlowGreen{0%{box-shadow:0 0 0 rgba(0,212,170,0)}30%{box-shadow:0 0 50px rgba(0,212,170,0.35)}100%{box-shadow:0 0 18px rgba(0,212,170,0.12)}}
@keyframes verdictGlowRed{0%{box-shadow:0 0 0 rgba(233,57,70,0)}30%{box-shadow:0 0 50px rgba(233,57,70,0.4)}100%{box-shadow:0 0 18px rgba(233,57,70,0.15)}}
@keyframes alertShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes statPop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes pixelPulse{0%,100%{opacity:0.4}50%{opacity:1}}
@keyframes stampIn{0%{opacity:0;transform:scale(2.2) rotate(-12deg)}60%{opacity:1;transform:scale(0.95) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}

/* Staggered entrance */
.stagger>*{opacity:0;animation:fadeIn 0.5s ease forwards}
.stagger>*:nth-child(1){animation-delay:0.05s}.stagger>*:nth-child(2){animation-delay:0.12s}
.stagger>*:nth-child(3){animation-delay:0.19s}.stagger>*:nth-child(4){animation-delay:0.26s}
.stagger>*:nth-child(5){animation-delay:0.33s}.stagger>*:nth-child(6){animation-delay:0.4s}
.stagger>*:nth-child(7){animation-delay:0.47s}.stagger>*:nth-child(8){animation-delay:0.54s}

/* Verdict reveal */
.verdict{animation:verdictPop 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards}
.verdict.green{animation:verdictPop 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards,verdictGlowGreen 1.6s ease forwards}
.verdict.red{animation:verdictPop 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards,verdictGlowRed 1.6s ease forwards,alertShake 0.5s ease 0.55s}
.verdict-stamp{display:inline-block;animation:stampIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.25s both}

/* Stat pop on live update */
.stat-pop{animation:statPop 0.4s ease}

/* Simulated photo pixels in scan box */
.pixel-photo{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;width:150px;height:96px;margin:0 auto}
.pixel-photo span{border-radius:1px;background:rgba(0,212,170,0.12)}
.scanning .pixel-photo span{animation:pixelPulse 1.2s ease infinite}

/* Live Ticker */
.ticker-wrap{position:fixed;bottom:0;left:0;right:0;z-index:150;background:rgba(3,3,6,0.92);backdrop-filter:blur(12px);border-top:1px solid rgba(0,212,170,0.08);height:32px;overflow:hidden}
.ticker-track{display:flex;align-items:center;height:32px;animation:tickerScroll 40s linear infinite;width:max-content}
.ticker-item{display:flex;align-items:center;gap:6px;padding:0 24px;white-space:nowrap;font-size:11px;color:#666;flex-shrink:0}
.ticker-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ticker-item strong{color:#999;font-weight:600}

/* Scan effect */
.scan-container{position:relative;overflow:hidden;border-radius:12px}
.scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--t),rgba(0,212,170,0.6),var(--t),transparent);z-index:10;animation:scanLine 1.5s ease-in-out;box-shadow:0 0 15px rgba(0,212,170,0.5),0 0 30px rgba(0,212,170,0.2)}
.scan-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,170,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,0.03) 1px,transparent 1px);background-size:20px 20px;opacity:0;transition:opacity 0.5s}
.scan-container.scanning .scan-grid{opacity:1}

/* Hero stats */
.hero-stat{text-align:center;padding:16px;border-radius:12px;background:rgba(0,212,170,0.03);border:1px solid rgba(0,212,170,0.08);transition:all 0.3s;opacity:0;animation:fadeIn 0.5s ease forwards,borderGlow 3s ease infinite 0.5s}
.hero-stat:hover{background:rgba(0,212,170,0.06);transform:translateY(-2px)}
.hero-stat-num{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--t),var(--b));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat-label{font-size:10px;color:#666;margin-top:2px;font-weight:500}

.page{animation:fadeIn 0.5s ease;min-height:calc(100vh - 52px);padding-bottom:40px}

/* NAV */
nav{position:sticky;top:0;z-index:200;background:rgba(3,3,6,0.85);backdrop-filter:blur(24px);border-bottom:1px solid rgba(21,21,32,0.8);padding:0 20px}
.nav-in{max-width:1020px;margin:0 auto;display:flex;align-items:center;height:52px;gap:16px}
.logo{cursor:pointer;display:flex;align-items:center;gap:8px;flex-shrink:0;transition:transform 0.2s}
.logo:hover{transform:scale(1.02)}
.logo-i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--t),var(--b));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--bg);animation:glow 3s ease infinite}
.logo-t{font-size:15px;font-weight:700;color:var(--w);letter-spacing:-0.5px}
.logo-v{font-size:11px;font-weight:700;color:var(--t)}
.tabs{display:flex;gap:2px;flex:1;justify-content:center;overflow:auto}
.tab{padding:6px 10px;border-radius:6px;border:none;background:transparent;color:#333;font-size:10px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:all 0.2s;position:relative}
.tab.on{color:var(--t)}
.tab.on::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:16px;height:2px;background:var(--t);border-radius:1px}
.rialo{font-family:'JetBrains Mono',monospace;font-size:8px;color:#1E1E28;letter-spacing:1px;flex-shrink:0}

/* CONTENT */
.wrap{max-width:1020px;margin:0 auto;padding:28px 20px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;transition:border-color 0.3s}
.box:hover{border-color:#1E1E2A}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hdr-n{font-size:24px;font-weight:900;color:rgba(0,212,170,0.1)}
.hdr-t{font-size:19px;font-weight:700;color:var(--w)}
.hdr-s{font-size:11px;color:var(--gd);margin-top:2px}
h3{font-size:16px;font-weight:700;color:var(--w);margin:0 0 10px}
.el{display:flex;gap:7px;align-items:flex-start;margin-bottom:6px}
.el-d{width:5px;height:5px;border-radius:50%;background:var(--t);margin-top:6px;flex-shrink:0}
.el-t{font-size:12px;color:#999;line-height:1.55}
.tb{padding:12px;background:rgba(0,212,170,0.03);border:1px solid rgba(0,212,170,0.08);border-radius:8px;margin-bottom:12px}
.tb-l{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.5px;color:var(--t);margin-bottom:5px;font-weight:600}
.tb-i{font-size:10.5px;color:#555;line-height:1.5;margin-bottom:2px}
.btns{display:flex;gap:7px;margin-top:10px}
.b1{padding:10px 28px;border-radius:9px;border:none;background:linear-gradient(135deg,var(--t),var(--b));color:var(--bg);font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 4px 20px rgba(0,212,170,0.15)}
.b1:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(0,212,170,0.25)}
.b2{padding:8px 18px;border-radius:7px;border:1px solid var(--border);background:transparent;color:#777;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.b2:hover{border-color:#2A2A35;color:#AAA}
.b3{padding:8px 18px;border-radius:7px;border:none;background:rgba(0,212,170,0.08);color:var(--t);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.b3:hover{background:rgba(0,212,170,0.12)}
.code{font-family:'JetBrains Mono',monospace}
.tag{font-family:'JetBrains Mono',monospace;font-size:8px;padding:3px 8px;border-radius:4px;display:inline-block}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top:2px solid var(--t);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 8px}

/* Verification cards */
.vc{padding:16px 12px;border-radius:12px;background:var(--card);border:1px solid var(--border);cursor:pointer;text-align:center;transition:all 0.25s;position:relative;overflow:hidden}
.vc:hover{border-color:#2A2A35;transform:translateY(-2px)}
.vc:disabled{opacity:0.3;cursor:not-allowed;transform:none}
.vc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:transparent;transition:background 0.3s}
.vc:hover::before{background:var(--t)}

/* Tier boxes */
.tier{padding:12px 14px;border-radius:10px;display:flex;align-items:center;gap:12px;margin-bottom:6px;transition:all 0.3s;cursor:default}
.tier:hover{transform:translateX(4px)}

/* Verification process animation */
.vp-container{position:relative;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:14px}
.vp-step{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative;transition:all 0.3s}
.vp-step.active{background:rgba(0,212,170,0.03);border-radius:8px;padding:10px 12px;margin:0 -12px}
.vp-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all 0.4s}
.vp-line{position:absolute;left:16px;top:42px;width:2px;height:calc(100% - 32px);background:var(--border)}
.vp-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
.vp-fill{height:100%;border-radius:2px;transition:width 0.8s ease}

/* Landing particles */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.particle{position:absolute;border-radius:50%;opacity:0.15;animation:float 6s ease-in-out infinite}

/* Landing hero glow */
.hero-glow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,170,0.08) 0%,transparent 70%);animation:float 8s ease-in-out infinite;pointer-events:none}

/* Orbit ring */
.orbit-ring{position:absolute;border:1px solid rgba(0,212,170,0.06);border-radius:50%;animation:orbitSlow 30s linear infinite}

/* Counter animation */
.counter{display:inline-block}

/* Shimmer effect */
.shimmer{background:linear-gradient(90deg,transparent 0%,rgba(0,212,170,0.05) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 3s ease infinite}

/* Edit chain */
.ec-node{padding:14px;border-radius:10px;text-align:center;transition:all 0.3s}
.ec-node:hover{transform:scale(1.02)}
.ec-arrow{text-align:center;padding:4px 0;font-size:18px;color:rgba(0,212,170,0.25)}

/* Business cards */
.biz{padding:18px;background:var(--card);border:1px solid var(--border);border-radius:12px;transition:all 0.3s}
.biz:hover{border-color:#2A2A35;transform:translateY(-2px)}

/* Limit items */
.lim{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;transition:all 0.3s}
.lim:hover{border-color:#2A2A35}

@media(max-width:700px){.cols{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)!important}.g3{grid-template-columns:1fr!important}}
</style>
</head>
<body>

<nav><div class="nav-in">
<div class="logo" onclick="go('landing')"><div class="logo-i">T</div><span class="logo-t">TruthLens <span class="logo-v">v2</span></span></div>

</div>

<script>
const ST=[
{id:'landing',l:'Home'},{id:'capture',l:'1. Capture'},{id:'register',l:'2. Register'},
{id:'verify',l:'3. Verify'},{id:'alert',l:'4. Alert'},{id:'editchain',l:'Edit Chain'},
{id:'dualhash',l:'Dual Hash'},{id:'business',l:'Business'},{id:'dashboard',l:'Dashboard'}
];
let cur='landing',rg=0,vr=null,vg=0,al=0,vpStep=0,vpTimer=null;

function go(s){cur=s;rg=0;vr=null;vg=0;al=0;vpStep=0;if(vpTimer){clearInterval(vpTimer);vpTimer=null;}if(alertTimer){clearInterval(alertTimer);alertTimer=null;}render();}
function render(){
document.getElementById('tabs').innerHTML=ST.map(s=>`<button class="tab ${cur===s.id?'on':''}" onclick="go('${s.id}')">${s.l}</button>`).join('');

a.innerHTML=`<div class="page">${pages[cur]?pages[cur]():pages.landing()}</div>`;

if(cur==='dashboard'){animateCounters();startDashStats();}
if(cur==='alert'&&al===1)setTimeout(()=>startAlertAnim(),300);
}

// === HELPERS ===
function eL(a){return a.map(i=>`<div class="el"><div class="el-d"></div><div class="el-t">${i}</div></div>`).join('')}
function tB(t,a){return `<div class="tb"><div class="tb-l">${t.toUpperCase()}</div>${a.map(i=>`<div class="tb-i">→ ${i}</div>`).join('')}</div>`}

// === PAGES ===
const pages={

// ============ LANDING ============
landing:()=>`
<div style="position:relative;text-align:center;padding:60px 20px 40px;max-width:800px;margin:0 auto;min-height:calc(100vh - 52px);display:flex;flex-direction:column;justify-content:center">
  <canvas id="particleCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0"></canvas>
  <div style="position:relative;z-index:1">
    <div style="text-align:center;margin-bottom:32px">
      <div style="display:inline-block;padding:4px 16px;background:rgba(0,212,170,0.06);border:1px solid rgba(0,212,170,0.12);border-radius:100px;font-size:10px;color:var(--t);font-weight:600;animation:fadeIn 0.6s ease">Upgraded after Builders Hub feedback</div>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:14px;flex-wrap:wrap">
      <div style="position:relative;flex-shrink:0">
        <div style="position:absolute;width:120px;height:120px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(0,212,170,0.2);animation:orbitSlow 20s linear infinite"></div>
        <div style="position:absolute;width:180px;height:180px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(0,212,170,0.1);animation:orbitSlow 30s linear infinite reverse"></div>
        <div style="width:80px;height:80px;border-radius:18px;background:linear-gradient(135deg,var(--t),var(--b));display:inline-flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:var(--bg);animation:float 4s ease-in-out infinite,glow 3s ease-in-out infinite;box-shadow:0 8px 50px rgba(0,212,170,0.35)">T</div>
      </div>
      <h1 style="font-size:clamp(36px,6vw,56px);font-weight:900;line-height:1.05;margin:0;letter-spacing:-1.5px;text-align:left">
        <span style="color:var(--w)">TruthLens</span> <span style="color:var(--t)">v2</span>
      </h1>
    </div>
    <p style="font-size:17px;color:#666;font-weight:400;margin:0 0 6px;text-align:center">Deepfake Provenance Registry on Rialo</p>
    <p style="font-size:13px;color:#444;max-width:460px;margin:0 auto 36px;line-height:1.7;text-align:center">Proves whether photos are real or AI-generated using dual hashing,<br>device TEE signatures, and Rialo's on-chain automation.</p>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:0 auto 28px" class="g4 stagger">
      ${[{i:'📸',t:'Capture',d:'Dual hash + TEE',s:'capture',c:'var(--t)'},{i:'🔍',t:'4-Tier Verify',d:'Real / AI / Unknown / Fake',s:'verify',c:'var(--b)'},{i:'✏️',t:'Edit Chain',d:'Track legitimate edits',s:'editchain',c:'var(--o)'},{i:'💰',t:'Business',d:'5 revenue streams',s:'business',c:'var(--p)'}].map(x=>`
      <div class="box" style="padding:16px 10px;cursor:pointer;text-align:center" onclick="go('${x.s}')">

        <div style="font-size:12px;font-weight:700;color:${x.c};margin-bottom:3px">${x.t}</div>
        <div style="font-size:9px;color:#555;line-height:1.3">${x.d}</div>

    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:32px">

      <div class="hero-stat"><div class="hero-stat-num" id="liveVerified">3,291,047</div><div class="hero-stat-label">Photos Registered</div></div>
      <div class="hero-stat"><div class="hero-stat-num" id="liveFlagged" style="background:linear-gradient(135deg,var(--r),#FF6B6B);-webkit-background-clip:text;-webkit-text-fill-color:transparent">41,208</div><div class="hero-stat-label">Deepfakes Caught</div></div>
      <div class="hero-stat"><div class="hero-stat-num" id="livePartners">147</div><div class="hero-stat-label">Device Partners</div></div>
      <div class="hero-stat"><div class="hero-stat-num">99.8%</div><div class="hero-stat-label">Accuracy Rate</div></div>

    <div style="display:flex;gap:5px;justify-content:center;flex-wrap:wrap;max-width:520px;margin:0 auto">
      ${['4-Tier Verify','Dual Hash','Auto-Register','Edit Chain','AI Ensemble','Business Model'].map(x=>`<span class="tag" style="background:rgba(255,255,255,0.02);border:1px solid var(--border);color:#444">${x}</span>`).join('')}
    </div>
  </div>
</div>`,

// ============ CAPTURE ============
capture:()=>`<div class="wrap">
<div class="hdr"><div class="hdr-n">01</div><div><div class="hdr-t">Capture</div><div class="hdr-s">Dual-hash proof created at the moment of capture</div></div></div>
<div class="cols stagger">
  <div class="box" style="display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden">
    <div id="captureFlash" style="position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:20;border-radius:14px;transition:opacity 0.1s"></div>
    <div id="phoneIcon" style="font-size:56px;margin-bottom:12px;transition:all 0.3s;animation:float 3s ease-in-out infinite">📱</div>
    <div id="captureBtn"><button class="b1" style="font-size:12px;padding:9px 24px" onclick="doCapture()">Simulate Capture 📸</button></div>
    <div id="captureData" style="width:100%;margin-top:12px"></div>
  </div>

// === VERIFY ANIMATION ===
function startVerify(type){
  vg=1;vr=null;vpStep=0;render();
  window._vtype=type;
}
function runVerifyAnim(){
  const scanBox=document.getElementById('scanBox');
  const scanStatus=document.getElementById('scanStatus');
  // Build simulated photo pixels with varied colors and pulse delays
  const pp=document.getElementById('pixelPhoto');
  if(pp){
    let phtml='';
    for(let i=0;i<96;i++){
      const v=Math.random();
      const c=v<0.55?`rgba(0,212,170,${0.08+Math.random()*0.25})`:v<0.8?`rgba(0,136,204,${0.1+Math.random()*0.2})`:`rgba(238,236,234,${0.05+Math.random()*0.12})`;
      phtml+=`<span style="background:${c};animation-delay:${(Math.random()*1.2).toFixed(2)}s"></span>`;
    }
    pp.innerHTML=phtml;
  }
  // Single continuous scan line through entire animation
  if(scanBox){
    const scanLine=document.createElement('div');
    scanLine.className='scan-line';
    scanLine.style.animation='scanLine 2.8s ease-in-out infinite';
    scanBox.appendChild(scanLine);
  }
  const steps=['vps1','vps2','vps3','vps4'];
  const statusTexts=['Checking cryptographic hash...','Checking perceptual hash...','Running AI ensemble...','Assigning verification tier...'];
  let i=0;
  vpTimer=setInterval(()=>{
    if(i>=steps.length){
      clearInterval(vpTimer);vpTimer=null;
      if(scanStatus)scanStatus.textContent='Analysis complete ✓';
      // Stop scan and clean up
      if(scanBox){
        const lines=scanBox.querySelectorAll('.scan-line');
        lines.forEach(l=>l.remove());
        scanBox.classList.remove('scanning');
      }
      setTimeout(()=>{vg=0;vr=window._vtype;render();},500);
      return;
    }
    const el=document.getElementById(steps[i]);
    if(scanStatus)scanStatus.textContent=statusTexts[i];
    if(!el){i++;return;}
    el.style.opacity='1';
    el.querySelector('.vp-icon').style.background='rgba(0,212,170,0.1)';
    el.querySelector('.vp-icon').style.borderColor='rgba(0,212,170,0.3)';
    el.querySelector('.vp-fill').style.width='100%';
    el.querySelector('.vp-status').textContent='✓';
    el.querySelector('.vp-status').style.color='var(--t)';
    i++;
  },700);
}

// === PARTICLE CANVAS ===
function initParticles(){
  const c=document.getElementById('particleCanvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  c.width=window.innerWidth;c.height=window.innerHeight;
  const particles=[];
  for(let i=0;i<60;i++){
    particles.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2.5+1,dx:(Math.random()-0.5)*0.4,dy:(Math.random()-0.5)*0.4,o:Math.random()*0.4+0.15});
  }
  function draw(){
    if(cur!=='landing')return;
    ctx.clearRect(0,0,c.width,c.height);
    particles.forEach(p=>{
      p.x+=p.dx;p.y+=p.dy;
      if(p.x<0||p.x>c.width)p.dx*=-1;
      if(p.y<0||p.y>c.height)p.dy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,212,170,${p.o})`;ctx.fill();
    });
    // Draw connections
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x;
        const dy=particles[i].y-particles[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<180){
          ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle=`rgba(0,212,170,${0.12*(1-dist/180)})`;
          ctx.lineWidth=0.8;ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize',()=>{c.width=window.innerWidth;c.height=window.innerHeight;});
}

// === COUNTER ANIMATION ===
function animateCounters(){
  document.querySelectorAll('.counter').forEach(el=>{
    const target=parseInt(el.dataset.target);
    const suffix=el.dataset.suffix||'';
    const duration=2000;
    const start=performance.now();
    function update(now){
      const elapsed=now-start;
      const progress=Math.min(elapsed/duration,1);
      const eased=1-Math.pow(1-progress,4);
      const current=Math.floor(eased*target);
      el.textContent=current.toLocaleString()+suffix;
      if(progress<1)requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  });
}
